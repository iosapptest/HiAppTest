name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: |
        xcodegen generate
        sed -i.bak -E 's|objectVersion = [0-9]+|objectVersion = 60|' HiApp.xcodeproj/project.pbxproj

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build the app (unsigned)
      run: |
        xcodebuild \
          -project HiApp.xcodeproj \
          -scheme HiApp \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Package as .ipa (unsigned)
      run: |
        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/HiApp.app Payload/
        zip -r HiApp.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: HiApp-ipa
        path: HiApp.ipa
